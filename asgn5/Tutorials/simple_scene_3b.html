<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Three.js - Load Multiple Custom Models</title>
    <style>
      body { margin: 0; }
      #c { width: 100vw; height: 100vh; display: block; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.183.2/examples/jsm/"
      }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js'; // Added OBJLoader
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.querySelector('#c');
    const renderer = new THREE.WebGLRenderer({antialias: true, canvas});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const fov = 45;
    const aspect = window.innerWidth / window.innerHeight;
    const near = 0.1;
    const far = 100;
    const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
    camera.position.set(0, 3, 10); // Pulled camera back to see everything

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 1, 0); 
    controls.update();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#333333'); 

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); 
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5); 
    directionalLight.position.set(5, 10, 5);
    scene.add(directionalLight);

    // --- LOADERS ---
    const gltfLoader = new GLTFLoader();
    const objLoader = new OBJLoader();

    // 1. Load the Duck (Center)
    gltfLoader.load('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb', (gltf) => {
        const duck = gltf.scene;
        duck.position.set(0, 0, 0);
        scene.add(duck);
    });

    // 2. Load the Mazda RX-7 (Left)
    gltfLoader.load('./Mazda RX-7.glb', (gltf) => {
        const mazda = gltf.scene;
        mazda.position.set(-3, 0, 0); // Shifted left
        scene.add(mazda);
    });

    // 3. Load the McLaren Senna (Right)
    gltfLoader.load('./uploads_files_2815692_Mclaren+Senna.glb', (gltf) => {
        const mclaren = gltf.scene;
        mclaren.position.set(3, 0, 0); // Shifted right
        scene.add(mclaren);
    });

    // 4. Load the base_tri OBJ (Behind)
    objLoader.load('./base_tri.obj', (obj) => {
        obj.position.set(0, 0, -3); // Shifted backward
        scene.add(obj);
    });

    // Handle Window Resizing
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize, false);

    // Animation Loop
    function animate() {
      controls.update(); 
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
</html>
