<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Three.js Textures - Wrapping and Filtering</title>
    <style>
      body { margin: 0; }
      #c { width: 100vw; height: 100vh; display: block; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.183.2/examples/jsm/"
      }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';

    const canvas = document.querySelector('#c');
    const renderer = new THREE.WebGLRenderer({antialias: true, canvas});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const fov = 75;
    const aspect = window.innerWidth / window.innerHeight;
    const near = 0.1;
    const far = 5;
    const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
    camera.position.z = 3;

    const scene = new THREE.Scene();
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const cubes = [];

    const loader = new THREE.TextureLoader();

    // --- CUBE 1: Texture Repeating / Wrapping ---
    const repeatTexture = loader.load('https://threejs.org/manual/examples/resources/images/wall.jpg');
    repeatTexture.colorSpace = THREE.SRGBColorSpace;
    
    // Tell Three.js to repeat the texture on both the horizontal (S) and vertical (T) axes
    repeatTexture.wrapS = THREE.RepeatWrapping;
    repeatTexture.wrapT = THREE.RepeatWrapping;
    
    // Set how many times it should repeat (2 times across, 2 times down)
    repeatTexture.repeat.set(2, 2);

    const material1 = new THREE.MeshBasicMaterial({ map: repeatTexture });
    const cube1 = new THREE.Mesh(geometry, material1);
    cube1.position.x = -1.2;
    scene.add(cube1);
    cubes.push(cube1);


    // --- CUBE 2: Texture Filtering (Magnification) ---
    // Let's make a tiny 2x2 pixel texture from raw data
    const width = 2;
    const height = 2;
    const data = new Uint8Array([
      255, 0, 0, 255,    // Red pixel
      0, 255, 0, 255,    // Green pixel
      0, 0, 255, 255,    // Blue pixel
      255, 255, 0, 255   // Yellow pixel
    ]);
    const pixelTexture = new THREE.DataTexture(data, width, height);
    pixelTexture.needsUpdate = true;
    pixelTexture.colorSpace = THREE.SRGBColorSpace;

    // MAGNIFICATION FILTER: 
    // Default is THREE.LinearFilter (which blurs). 
    // We change it to NearestFilter to keep the sharp, blocky pixel edges.
    pixelTexture.magFilter = THREE.NearestFilter;

    const material2 = new THREE.MeshBasicMaterial({ map: pixelTexture });
    const cube2 = new THREE.Mesh(geometry, material2);
    cube2.position.x = 1.2;
    scene.add(cube2);
    cubes.push(cube2);


    // Handle Window Resizing
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize, false);

    // Animation Loop
    function animate(time) {
      time *= 0.001;
      cubes.forEach((cube, ndx) => {
        const speed = 1 + ndx * 0.1;
        const rot = time * speed;
        cube.rotation.x = rot;
        cube.rotation.y = rot;
      });
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
</html>
