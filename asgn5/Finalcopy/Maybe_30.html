<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nopon Hunter: Hall of Relics</title>
    <style>
      body { margin: 0; overflow: hidden; background: #111; }
      #c { width: 100vw; height: 100vh; display: block; }
      #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: sans-serif;
        pointer-events: none;
        text-shadow: 1px 1px 2px black;
        z-index: 10;
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.183.2/examples/jsm/"
      }
    }
    </script>
  </head>

  <body>
    <div id="ui">
      <h2>Nopon Hunter: Hall of Relics</h2>
      <p>Left Click + Drag: Orbit Camera</p>
      <p>Scroll: Zoom</p>
      <p><b>WOW FEATURE:</b> Click floating relics to make them glow.</p>
      <p><b>Extra feature note:</b> Nopon Hunter shrine world, lighting presets, cinematic fly-by, fleeing AI, glowing pedestals, interactive relics, and world/background toggles.</p>
    </div>

    <canvas id="c"></canvas>

    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
      import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
      import { RectAreaLightHelper } from 'three/addons/helpers/RectAreaLightHelper.js';

      RectAreaLightUniformsLib.init();

      const canvas = document.querySelector('#c');
      const renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1500
      );
      camera.position.set(0, 16, 40);

      const controls = new OrbitControls(camera, canvas);
      controls.target.set(0, 2, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.update();

      const FLOOR_Y = -2.05;

      const exhibitTargets = {
        mazda: new THREE.Vector3(-18, 1, 0),
        mclaren: new THREE.Vector3(18, 1, 0),
        bmw: new THREE.Vector3(0, 1, -18),
        duck: new THREE.Vector3(0, 1, 18),
        nopon: new THREE.Vector3(0, 2, 0),
        center: new THREE.Vector3(0, 2, 0),
      };

      const loadedExhibits = {
        duck: null,
        mazda: null,
        mclaren: null,
        bmw: null,
        nopon: null,
      };

      // ==========================================
      // SKYBOX / ENVIRONMENT
      // ==========================================
      const cubeTextureLoader = new THREE.CubeTextureLoader();
      const environmentMap = cubeTextureLoader.load([
        './pos-x.jpg',
        './neg-x.jpg',
        './pos-y.jpg',
        './neg-y.jpg',
        './pos-z.jpg',
        './neg-z.jpg'
      ]);
      environmentMap.colorSpace = THREE.SRGBColorSpace;

      const darkBackground = new THREE.Color(0x111111);

      const worldParams = {
        showBackground: true,
        useEnvironmentLight: true,
      };

      function applyWorldSettings() {
        scene.background = worldParams.showBackground ? environmentMap : darkBackground;
        scene.environment = worldParams.useEnvironmentLight ? environmentMap : null;
      }

      applyWorldSettings();

      // ==========================================
      // FLOOR / WORLD
      // ==========================================
      const floorGeo = new THREE.PlaneGeometry(480, 480);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x2a2a2a,
        roughness: 0.45,
        metalness: 0.15
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = FLOOR_Y;
      floor.receiveShadow = true;
      scene.add(floor);

      // ==========================================
      // DISPLAY CYLINDER / SHRINE BOUNDARY
      // ==========================================
      const displayGroup = new THREE.Group();
      displayGroup.position.set(0, FLOOR_Y, 0);
      scene.add(displayGroup);

      const displayRadius = 36;
      const displayHeight = 10;

      const wallGeo = new THREE.CylinderGeometry(displayRadius, displayRadius, displayHeight, 96, 1, true);
      const wallMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.12,
        roughness: 0.08,
        metalness: 0.45,
        side: THREE.DoubleSide
      });
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(0, displayHeight / 2, 0);
      wall.receiveShadow = true;
      displayGroup.add(wall);

      const rimGeo = new THREE.TorusGeometry(displayRadius, 0.18, 16, 120);
      const sharedRimMat = new THREE.MeshStandardMaterial({
        color: 0xc9c12e,
        roughness: 0.2,
        metalness: 0.8
      });

      const topRim = new THREE.Mesh(rimGeo, sharedRimMat);
      topRim.rotation.x = Math.PI / 2;
      topRim.position.set(0, displayHeight, 0);
      topRim.castShadow = true;
      topRim.receiveShadow = true;
      displayGroup.add(topRim);

      const bottomRim = new THREE.Mesh(rimGeo, sharedRimMat);
      bottomRim.rotation.x = Math.PI / 2;
      bottomRim.position.set(0, 0, 0);
      bottomRim.castShadow = true;
      bottomRim.receiveShadow = true;
      displayGroup.add(bottomRim);

      // ==========================================
      // SHRINE / MAZE / STRUCTURES
      // ==========================================
      function makeShrineRing(radius, height, count, color) {
        const group = new THREE.Group();
        const pillarGeo = new THREE.CylinderGeometry(0.9, 1.1, height, 12);
        const pillarMat = new THREE.MeshStandardMaterial({
          color,
          roughness: 0.7,
          metalness: 0.15
        });

        for (let i = 0; i < count; i++) {
          const angle = i * (Math.PI * 2 / count);
          const pillar = new THREE.Mesh(pillarGeo, pillarMat);
          pillar.position.set(
            Math.cos(angle) * radius,
            FLOOR_Y + height / 2,
            Math.sin(angle) * radius
          );
          pillar.castShadow = true;
          pillar.receiveShadow = true;
          group.add(pillar);

          const cap = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 16, 12),
            new THREE.MeshStandardMaterial({
              color: 0x88d8ff,
              emissive: 0x3399ff,
              emissiveIntensity: 0.8,
              roughness: 0.2,
              metalness: 0.5
            })
          );
          cap.position.set(
            pillar.position.x,
            pillar.position.y + height / 2 + 0.2,
            pillar.position.z
          );
          cap.castShadow = true;
          group.add(cap);
        }

        scene.add(group);
        return group;
      }

      function makeMazeWall(x, z, w, h, d, color = 0x5d5349) {
        const wall = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshStandardMaterial({
            color,
            roughness: 0.85,
            metalness: 0.05
          })
        );
        wall.position.set(x, FLOOR_Y + h / 2, z);
        wall.castShadow = true;
        wall.receiveShadow = true;
        scene.add(wall);
        return wall;
      }

      function makeBanner(x, z, colorHex) {
        const pole = new THREE.Mesh(
          new THREE.CylinderGeometry(0.08, 0.08, 6.5, 12),
          new THREE.MeshStandardMaterial({ color: 0x8b7b67, roughness: 0.8 })
        );
        pole.position.set(x, FLOOR_Y + 3.25, z);
        pole.castShadow = true;
        scene.add(pole);

        const cloth = new THREE.Mesh(
          new THREE.PlaneGeometry(2.2, 3.2),
          new THREE.MeshStandardMaterial({
            color: colorHex,
            emissive: colorHex,
            emissiveIntensity: 0.12,
            side: THREE.DoubleSide,
            roughness: 0.75
          })
        );
        cloth.position.set(x + 1.15, FLOOR_Y + 4.0, z);
        cloth.rotation.y = Math.PI / 2;
        scene.add(cloth);
        return { pole, cloth };
      }

      makeShrineRing(10, 5.5, 8, 0x5b534a);
      makeShrineRing(24, 7.5, 12, 0x4d473f);

      // Outer maze / huntground walls
      makeMazeWall(-28, 0, 2, 6, 26);
      makeMazeWall(28, 0, 2, 6, 26);
      makeMazeWall(0, -28, 26, 6, 2);
      makeMazeWall(0, 28, 26, 6, 2);

      makeMazeWall(-16, -10, 18, 5, 2);
      makeMazeWall(16, 10, 18, 5, 2);
      makeMazeWall(-10, 16, 2, 5, 18);
      makeMazeWall(10, -16, 2, 5, 18);

      makeMazeWall(-22, 16, 10, 4.5, 2);
      makeMazeWall(22, -16, 10, 4.5, 2);
      makeMazeWall(-16, -22, 2, 4.5, 10);
      makeMazeWall(16, 22, 2, 4.5, 10);

      makeBanner(-30, -8, 0x2244aa);
      makeBanner(30, 8, 0xaa2288);
      makeBanner(-8, 30, 0xddaa33);
      makeBanner(8, -30, 0x88ddff);

      // ==========================================
      // LIGHTS
      // ==========================================
      const hemiLight = new THREE.HemisphereLight(0xB1E1FF, 0xB97A20, 0.4);
      scene.add(hemiLight);

      const pointLight = new THREE.PointLight(0xFFFFFF, 3, 80);
      pointLight.position.set(0, 10, 0);
      pointLight.castShadow = true;
      scene.add(pointLight);

      const pointLightHelper = new THREE.PointLightHelper(pointLight, 0.7);
      scene.add(pointLightHelper);

      const dirLight = new THREE.DirectionalLight(0xFFFFFF, 2);
      dirLight.position.set(18, 20, 14);
      dirLight.castShadow = true;
      dirLight.shadow.bias = 0.0005;
      dirLight.shadow.camera.left = -60;
      dirLight.shadow.camera.right = 60;
      dirLight.shadow.camera.top = 60;
      dirLight.shadow.camera.bottom = -60;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.visible = false;
      scene.add(dirLight);

      const dirLightHelper = new THREE.DirectionalLightHelper(dirLight);
      dirLightHelper.visible = false;
      scene.add(dirLightHelper);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
      ambientLight.visible = false;
      scene.add(ambientLight);

      const spotLight = new THREE.SpotLight(0xffffff, 15, 140, Math.PI / 6, 0.3, 1);
      spotLight.position.set(-16, 24, 10);
      spotLight.target.position.set(0, 1, 0);
      spotLight.castShadow = true;
      spotLight.visible = false;
      scene.add(spotLight);
      scene.add(spotLight.target);

      const spotLightHelper = new THREE.SpotLightHelper(spotLight);
      spotLightHelper.visible = false;
      scene.add(spotLightHelper);

      const rectLight = new THREE.RectAreaLight(0xffffff, 8, 14, 8);
      rectLight.position.set(0, 10, 16);
      rectLight.lookAt(0, 1, 0);
      rectLight.visible = false;
      scene.add(rectLight);

      const rectLightHelper = new RectAreaLightHelper(rectLight);
      rectLight.add(rectLightHelper);
      rectLightHelper.visible = false;

      const followSpot = new THREE.SpotLight(0xffffff, 0, 120, Math.PI / 7, 0.45, 1);
      followSpot.position.set(0, 18, 0);
      followSpot.castShadow = true;
      scene.add(followSpot);
      scene.add(followSpot.target);

      const followSpotHelper = new THREE.SpotLightHelper(followSpot);
      followSpotHelper.visible = false;
      scene.add(followSpotHelper);

      // ==========================================
      // LOADERS / HELPERS
      // ==========================================
      const gltfLoader = new GLTFLoader();
      const objLoader = new OBJLoader();
      const texLoader = new THREE.TextureLoader();

      function enableShadows(model) {
        model.traverse((node) => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
          }
        });
      }

      function fitModelToTargetSize(root, targetSize) {
        root.updateMatrixWorld(true);

        const box = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        box.getSize(size);

        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim === 0) return;

        const scale = targetSize / maxDim;
        root.scale.multiplyScalar(scale);

        root.updateMatrixWorld(true);

        const newBox = new THREE.Box3().setFromObject(root);
        const center = new THREE.Vector3();
        const min = new THREE.Vector3();
        newBox.getCenter(center);
        min.copy(newBox.min);

        root.position.x -= center.x;
        root.position.z -= center.z;
        root.position.y -= min.y;
      }

      function placeOnFloor(root, x, z) {
        root.position.x += x;
        root.position.y += FLOOR_Y;
        root.position.z += z;
      }

      function setMaterialPolygonOffset(root) {
        root.traverse((node) => {
          if (node.isMesh && node.material) {
            node.material.polygonOffset = true;
            node.material.polygonOffsetFactor = 1;
            node.material.polygonOffsetUnits = 1;
          }
        });
      }

      function makePedestal(x, z, colorHex) {
        const pedestalGroup = new THREE.Group();

        const baseGeo = new THREE.CylinderGeometry(2.6, 2.6, 0.18, 48);
        const baseMat = new THREE.MeshStandardMaterial({
          color: 0x111111,
          emissive: colorHex,
          emissiveIntensity: 1.0,
          roughness: 0.35,
          metalness: 0.25
        });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.set(x, FLOOR_Y + 0.09, z);
        base.receiveShadow = true;
        pedestalGroup.add(base);

        const ringGeo = new THREE.TorusGeometry(2.4, 0.08, 12, 64);
        const ringMat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          emissive: colorHex,
          emissiveIntensity: 1.5,
          roughness: 0.15,
          metalness: 0.8
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.set(x, FLOOR_Y + 0.16, z);
        pedestalGroup.add(ring);

        const glowGeo = new THREE.CircleGeometry(2.2, 48);
        const glowMat = new THREE.MeshBasicMaterial({
          color: colorHex,
          transparent: true,
          opacity: 0.22,
          side: THREE.DoubleSide
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.rotation.x = -Math.PI / 2;
        glow.position.set(x, FLOOR_Y + 0.17, z);
        pedestalGroup.add(glow);

        scene.add(pedestalGroup);
        return { base, ring, glow };
      }

      // ==========================================
      // NOPON HUNTER
      // ==========================================
      function makeNoponHunter() {
        const nopon = new THREE.Group();

        const furMat = new THREE.MeshStandardMaterial({
          color: 0xf3e6c8,
          roughness: 0.92,
          metalness: 0.0
        });

        const bellyMat = new THREE.MeshStandardMaterial({
          color: 0xfff6e8,
          roughness: 0.95,
          metalness: 0.0
        });

        const clothMat = new THREE.MeshStandardMaterial({
          color: 0x2d5a88,
          roughness: 0.8,
          metalness: 0.05
        });

        const leatherMat = new THREE.MeshStandardMaterial({
          color: 0x6b4423,
          roughness: 0.85,
          metalness: 0.02
        });

        const metalMat = new THREE.MeshStandardMaterial({
          color: 0xcfd6df,
          roughness: 0.25,
          metalness: 0.85
        });

        const glowMat = new THREE.MeshStandardMaterial({
          color: 0x88ddff,
          emissive: 0x44bbff,
          emissiveIntensity: 1.6,
          roughness: 0.2,
          metalness: 0.2
        });

        const body = new THREE.Mesh(new THREE.SphereGeometry(2.2, 32, 24), furMat);
        body.scale.set(1.15, 1.0, 1.0);
        body.position.y = 3.0;
        nopon.add(body);

        const belly = new THREE.Mesh(new THREE.SphereGeometry(1.2, 24, 18), bellyMat);
        belly.scale.set(1.0, 1.15, 0.7);
        belly.position.set(0, 2.7, 1.4);
        nopon.add(belly);

        const head = new THREE.Mesh(new THREE.SphereGeometry(1.7, 32, 24), furMat);
        head.position.set(0, 5.0, 0.3);
        nopon.add(head);

        const earGeo = new THREE.ConeGeometry(0.9, 2.8, 4);
        const leftEar = new THREE.Mesh(earGeo, furMat);
        leftEar.position.set(-1.8, 5.8, 0.1);
        leftEar.rotation.z = Math.PI / 3.2;
        leftEar.rotation.x = 0.35;
        nopon.add(leftEar);

        const rightEar = new THREE.Mesh(earGeo, furMat);
        rightEar.position.set(1.8, 5.8, 0.1);
        rightEar.rotation.z = -Math.PI / 3.2;
        rightEar.rotation.x = 0.35;
        nopon.add(rightEar);

        const eyeGeo = new THREE.SphereGeometry(0.16, 16, 12);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.45, 5.1, 1.45);
        nopon.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.45, 5.1, 1.45);
        nopon.add(rightEye);

        const beak = new THREE.Mesh(
          new THREE.ConeGeometry(0.28, 0.9, 4),
          new THREE.MeshStandardMaterial({ color: 0xd9a441, roughness: 0.8 })
        );
        beak.rotation.x = Math.PI / 2;
        beak.position.set(0, 4.55, 1.65);
        nopon.add(beak);

        const scarf = new THREE.Mesh(new THREE.TorusGeometry(1.35, 0.18, 12, 36), clothMat);
        scarf.rotation.x = Math.PI / 2;
        scarf.position.set(0, 4.0, 0.15);
        nopon.add(scarf);

        const cape = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.6, 0.15), clothMat);
        cape.position.set(0, 3.4, -1.8);
        nopon.add(cape);

        const armGeo = new THREE.CapsuleGeometry(0.28, 1.3, 4, 8);

        const leftArm = new THREE.Mesh(armGeo, furMat);
        leftArm.position.set(-2.0, 3.4, 0.6);
        leftArm.rotation.z = 0.7;
        nopon.add(leftArm);

        const rightArm = new THREE.Mesh(armGeo, furMat);
        rightArm.position.set(2.0, 3.3, 0.3);
        rightArm.rotation.z = -0.8;
        nopon.add(rightArm);

        const legGeo = new THREE.CapsuleGeometry(0.32, 1.0, 4, 8);

        const leftLeg = new THREE.Mesh(legGeo, furMat);
        leftLeg.position.set(-0.7, 1.1, 0.2);
        nopon.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, furMat);
        rightLeg.position.set(0.7, 1.1, 0.2);
        nopon.add(rightLeg);

        const bootGeo = new THREE.SphereGeometry(0.45, 16, 12);
        const leftBoot = new THREE.Mesh(bootGeo, leatherMat);
        leftBoot.scale.set(1.2, 0.7, 1.6);
        leftBoot.position.set(-0.7, 0.2, 0.45);
        nopon.add(leftBoot);

        const rightBoot = new THREE.Mesh(bootGeo, leatherMat);
        rightBoot.scale.set(1.2, 0.7, 1.6);
        rightBoot.position.set(0.7, 0.2, 0.45);
        nopon.add(rightBoot);

        const pack = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 0.9), leatherMat);
        pack.position.set(0, 3.2, -1.8);
        nopon.add(pack);

        const swordGroup = new THREE.Group();

        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.8, 0.28), metalMat);
        blade.position.y = 1.5;
        swordGroup.add(blade);

        const guard = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.12, 0.25), metalMat);
        guard.position.y = 0.12;
        swordGroup.add(guard);

        const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.7, 12), leatherMat);
        hilt.position.y = -0.35;
        swordGroup.add(hilt);

        const gem = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), glowMat);
        gem.position.set(0, 0.15, 0);
        swordGroup.add(gem);

        swordGroup.position.set(2.65, 2.85, 0.9);
        swordGroup.rotation.z = -0.55;
        nopon.add(swordGroup);

        nopon.userData = {
          leftEar,
          rightEar,
          cape,
          leftArm,
          rightArm,
          leftLeg,
          rightLeg,
          swordGroup,
          gem,
        };

        nopon.traverse((node) => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
          }
        });

        return nopon;
      }

      const noponHunter = makeNoponHunter();
      noponHunter.position.set(0, FLOOR_Y, 0);
      scene.add(noponHunter);
      loadedExhibits.nopon = noponHunter;

      // ==========================================
      // NOPON AI
      // ==========================================
      const noponAI = {
        waypoints: [
          new THREE.Vector3(0, FLOOR_Y, 0),
          new THREE.Vector3(12, FLOOR_Y, 12),
          new THREE.Vector3(-14, FLOOR_Y, 10),
          new THREE.Vector3(-12, FLOOR_Y, -14),
          new THREE.Vector3(14, FLOOR_Y, -12),
          new THREE.Vector3(0, FLOOR_Y, 20),
        ],
        currentIndex: 0,
        speed: 5.5,
        fleeDistance: 11,
        isFleeing: false,
        pauseTimer: 0,
      };

      function updateNoponAI(delta, time) {
        if (!noponHunter) return;

        const camXZ = new THREE.Vector3(camera.position.x, FLOOR_Y, camera.position.z);
        const noponXZ = new THREE.Vector3(noponHunter.position.x, FLOOR_Y, noponHunter.position.z);
        const distToCamera = camXZ.distanceTo(noponXZ);

        if (distToCamera < noponAI.fleeDistance && noponAI.pauseTimer <= 0) {
          noponAI.isFleeing = true;

          let bestIndex = noponAI.currentIndex;
          let bestDist = -Infinity;

          noponAI.waypoints.forEach((wp, idx) => {
            const d = wp.distanceTo(camXZ);
            if (d > bestDist) {
              bestDist = d;
              bestIndex = idx;
            }
          });

          noponAI.currentIndex = bestIndex;
        }

        const target = noponAI.waypoints[noponAI.currentIndex];
        const toTarget = new THREE.Vector3().subVectors(target, noponHunter.position);
        toTarget.y = 0;
        const dist = toTarget.length();

        if (noponAI.isFleeing) {
          if (dist > 0.2) {
            toTarget.normalize();
            noponHunter.position.addScaledVector(toTarget, noponAI.speed * delta);

            const facing = Math.atan2(toTarget.x, toTarget.z);
            noponHunter.rotation.y = facing;

            const swing = Math.sin(time * 14);
            noponHunter.userData.leftLeg.rotation.x = swing * 0.7;
            noponHunter.userData.rightLeg.rotation.x = -swing * 0.7;
            noponHunter.userData.leftArm.rotation.x = -swing * 0.4;
            noponHunter.userData.rightArm.rotation.x = swing * 0.4;
            noponHunter.userData.cape.rotation.x = 0.2 + Math.abs(Math.sin(time * 10)) * 0.25;
          } else {
            noponAI.isFleeing = false;
            noponAI.pauseTimer = 1.4;

      function updateOrbitingObjects(time) {
        orbitingObjects.forEach((entry, i) => {
          const angle = time * entry.speed + entry.angleOffset;
          entry.mesh.position.x = Math.cos(angle) * entry.radius;
          entry.mesh.position.z = Math.sin(angle) * entry.radius;
          entry.mesh.position.y = entry.baseY + Math.sin(time * 2 + i) * entry.bobAmp;
        });
      }

      function updateSpins(time) {
        floatingAnimationData.forEach((entry) => {
          entry.mesh.rotation.x = time * entry.spinX + entry.phase;
          entry.mesh.rotation.y = time * entry.spinY + entry.phase;
        });
      }

      function updatePedestalGlow(time) {
        Object.values(pedestals).forEach((pedestal, i) => {
          const pulse = 1.0 + 0.25 * Math.sin(time * 2.2 + i);
          pedestal.base.material.emissiveIntensity = 0.9 * pulse;
          pedestal.ring.material.emissiveIntensity = 1.3 * pulse;
          pedestal.glow.material.opacity = 0.14 + 0.08 * Math.sin(time * 2.2 + i);
        });
      }

      function getSelectedTarget() {
        return exhibitTargets[tourParams.selectedExhibit] || exhibitTargets.center;
      }

      function updateShowcaseSpotlight(time) {
        if (!tourParams.followSpotlight) {
          followSpot.intensity = 0;
          return;
        }

        const target = getSelectedTarget();
        followSpot.position.set(
          target.x + Math.cos(time * 0.7) * 6,
          16 + Math.sin(time * 0.9) * 1.5,
          target.z + Math.sin(time * 0.7) * 6
        );
        followSpot.target.position.copy(target);

        if (helpersParam.visible) {
          followSpotHelper.visible = true;
        }
      }

      function updateCinematicTour(time) {
        if (tourParams.cinematicTour) {
          controls.enabled = false;
          const focus = getSelectedTarget();
          const radius = tourParams.selectedExhibit === 'center' ? 60 : 22;
          camera.position.x = focus.x + Math.sin(time * 0.18) * radius;
          camera.position.z = focus.z + Math.cos(time * 0.18) * radius;
          camera.position.y = 12 + Math.sin(time * 0.33) * 3;
          camera.lookAt(focus.x, focus.y + 1.5, focus.z);
        } else {
          controls.enabled = true;
          controls.target.copy(getSelectedTarget());
          controls.update();
        }
      }

      // ==========================================
      // RESIZE
      // ==========================================
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener('resize', onWindowResize);

      // ==========================================
      // ANIMATION LOOP
      // ==========================================
      const clock = new THREE.Clock();

      function animate() {
        const delta = clock.getDelta();
        const time = clock.elapsedTime;

        if (tourParams.autoRotateArt) {
          updateOrbitingObjects(time);
          updateSpins(time);
        }

        updatePedestalGlow(time);
        updateNoponAI(delta, time);
        updateShowcaseSpotlight(time);
        updateCinematicTour(time);

        spotLightHelper.update();
        followSpotHelper.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      animate();
    </script>
