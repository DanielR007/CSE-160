<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Three.js - Three Lights & Controls</title>
    <style>
      body { margin: 0; }
      #c { width: 100vw; height: 100vh; display: block; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@v0.183.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.183.2/examples/jsm/"
      }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

    const canvas = document.querySelector('#c');
    const renderer = new THREE.WebGLRenderer({antialias: true, canvas});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const fov = 45;
    const aspect = window.innerWidth / window.innerHeight;
    const near = 0.1;
    const far = 200; 
    const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
    camera.position.set(0, 6, 14);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0, 0); 
    controls.update();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#333333'); 

    // ==========================================
    // 1. HEMISPHERE LIGHT (Sky & Ground)
    // ==========================================
    const skyColor = 0xB1E1FF;  // Light blue
    const groundColor = 0xB97A20;  // Brownish orange
    const hemiLight = new THREE.HemisphereLight(skyColor, groundColor, 1);
    scene.add(hemiLight);

    // ==========================================
    // 2. DIRECTIONAL LIGHT (The Sun)
    // ==========================================
    const dirLight = new THREE.DirectionalLight(0xFFFFFF, 1.5);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    const dirLightHelper = new THREE.DirectionalLightHelper(dirLight);
    scene.add(dirLightHelper);

    // ==========================================
    // 3. POINT LIGHT (Floating Lightbulb)
    // ==========================================
    const pointLight = new THREE.PointLight(0xFF0000, 5, 15); // Red light to make it obvious
    pointLight.position.set(0, 3, 0); // Hovering in the middle of the cars
    scene.add(pointLight);

    const pointLightHelper = new THREE.PointLightHelper(pointLight);
    scene.add(pointLightHelper);


    // --- LOAD MODELS ---
    const gltfLoader = new GLTFLoader();
    const objLoader = new OBJLoader();

    gltfLoader.load('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb', (gltf) => {
        const duck = gltf.scene;
        duck.position.set(0, 0, 3);
        scene.add(duck);
    });

    gltfLoader.load('./Mazda RX-7.glb', (gltf) => {
        const mazda = gltf.scene;
        mazda.position.set(-4, 0, 0); 
        scene.add(mazda);
    });

    gltfLoader.load('./uploads_files_2815692_Mclaren+Senna.glb', (gltf) => {
        const mclaren = gltf.scene;
        mclaren.position.set(4, 0, 0); 
        scene.add(mclaren);
    });

    objLoader.load('./base_tri.obj', (obj) => {
        obj.position.set(0, 0, -3); 
        scene.add(obj);
    });

    // ==========================================
    // GUI CONTROLS & HELPERS
    // ==========================================
    const gui = new GUI();

    // GUI Helper class to easily change Three.js colors via hex strings
    class ColorGUIHelper {
      constructor(object, prop) {
        this.object = object;
        this.prop = prop;
      }
      get value() { return `#${this.object[this.prop].getHexString()}`; }
      set value(hexString) { this.object[this.prop].set(hexString); }
    }

    // Function to update the light helpers when moving sliders
    function updateLightHelpers() {
      dirLightHelper.update();
      pointLightHelper.update();
    }

    // --- Hemisphere Light Folder ---
    const hemiFolder = gui.addFolder('Hemisphere Light');
    hemiFolder.addColor(new ColorGUIHelper(hemiLight, 'color'), 'value').name('Sky Color');
    hemiFolder.addColor(new ColorGUIHelper(hemiLight, 'groundColor'), 'value').name('Ground Color');
    hemiFolder.add(hemiLight, 'intensity', 0, 5, 0.01);

    // --- Directional Light Folder ---
    const dirFolder = gui.addFolder('Directional Light');
    dirFolder.addColor(new ColorGUIHelper(dirLight, 'color'), 'value').name('Color');
    dirFolder.add(dirLight, 'intensity', 0, 5, 0.01);
    dirFolder.add(dirLight.position, 'x', -10, 10).onChange(updateLightHelpers);
    dirFolder.add(dirLight.position, 'y', 0, 10).onChange(updateLightHelpers);
    dirFolder.add(dirLight.position, 'z', -10, 10).onChange(updateLightHelpers);

    // --- Point Light Folder ---
    const pointFolder = gui.addFolder('Point Light');
    pointFolder.addColor(new ColorGUIHelper(pointLight, 'color'), 'value').name('Color');
    pointFolder.add(pointLight, 'intensity', 0, 20, 0.01);
    pointFolder.add(pointLight, 'distance', 0, 40).onChange(updateLightHelpers);
    pointFolder.add(pointLight.position, 'y', 0, 10).name('Height').onChange(updateLightHelpers);

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize, false);

    function animate() {
      controls.update(); 
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
</html>
